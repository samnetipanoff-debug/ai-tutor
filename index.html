<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AI Tutor</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f5;
      color: #171717;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 64px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(247, 247, 245, 0.92);
      border-bottom: 1px solid #e7e7e4;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 17px;
      font-weight: 650;
    }

    .subtitle {
      font-size: 12px;
      color: #777;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #ecece9;
      font-size: 18px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
    }

    .tutor {
      align-self: flex-start;
      background: white;
      border: 1px solid #e8e8e5;
      border-bottom-left-radius: 6px;
    }

    .user {
      align-self: flex-end;
      background: #171717;
      color: white;
      border-bottom-right-radius: 6px;
    }
 
    .message-label {
      font-size: 11px;
      opacity: 0.55;
      margin-bottom: 4px;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      justify-content: center;

      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));

      background: linear-gradient(
        transparent,
        #f7f7f5 28%
      );
    }

    .bottom-inner {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid #dededb;
      border-radius: 25px;
      background: white;
      padding: 0 18px;
      font-size: 15px;
      outline: none;
    }

    .input:focus {
      border-color: #bdbdb8;
    }

    .send {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #171717;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .mic {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: white;
      border: 1px solid #dededb;
      font-size: 20px;
      cursor: pointer;
    }

    .mic.active {
      background: #171717;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="header-title">
      <div class="title">AI Tutor</div>
      <div class="subtitle">Online Conversation</div>
    </div>

    <button class="icon-button" onclick="closeApp()">×</button>

  </header>

  <main class="chat" id="chat">

    <div class="message tutor">
      <div class="message-label">Tutor</div>
      Hi! How was your day?
    </div>

    <div class="message user">
      <div class="message-label">You</div>
      It was very good.
    </div>

    <div class="message tutor">
      <div class="message-label">Tutor</div>
      That's great! What did you do today?
    </div>

  </main>

  <div class="bottom">

    <div class="bottom-inner">

      <button
        class="mic"
        id="mic"
        onclick="toggleMic()"
      >
        🎙️
      </button>

      <input
        class="input"
        id="input"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button
        class="send"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>

<script>
  
  const tg = window.Telegram?.WebApp;

let telegramUser = null;

if (tg) {
  tg.ready();
  tg.expand();

  telegramUser = tg.initDataUnsafe?.user || null;

  console.log("Telegram user:", telegramUser);

  if (telegramUser) {
    console.log(
      "Telegram ID:",
      telegramUser.id,
      "Name:",
      telegramUser.first_name,
      "Username:",
      telegramUser.username
    );
  }

  async function connectTelegramUser() {
  if (!tg || !tg.initData) {
    console.log("Telegram initData is not available");
    return;
  }

  try {
    const response = await fetch(
      "https://qnvuadgqpptazfnuadfe.supabase.co/functions/v1/rapid-worker",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          initData: tg.initData,
        }),
      }
    );

    const data = await response.json();

    console.log("Backend response:", data);

    if (data.ok) {
      console.log("Telegram user verified:", data.user);
    } else {
      console.error("Telegram verification failed:", data.error);
    }
  } catch (error) {
    console.error("Connection error:", error);
  }
}

connectTelegramUser();
  
}
  function closeApp() {
    if (tg) {
      tg.close();
    }
  }

  function addMessage(text, type) {
    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.innerHTML = `
      <div class="message-label">
        ${type === "user" ? "You" : "Tutor"}
      </div>
      ${escapeHtml(text)}
    `;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }

  function sendMessage() {
    const input = document.getElementById("input");

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");

    input.value = "";

    setTimeout(() => {
      addMessage(
        "I heard you. The AI tutor will answer here.",
        "tutor"
      );
    }, 500);
  }

  function toggleMic() {
    const mic = document.getElementById("mic");

    mic.classList.toggle("active");
  }

  function escapeHtml(text) {
    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

  document
    .getElementById("input")
    .addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
</script>

</body>
</html>
