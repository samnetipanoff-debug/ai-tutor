<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>AI Tutor</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 22px 20px 14px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      color: #6b7280;
      font-size: 14px;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
    }

    .profile {
      margin: 16px;
      padding: 16px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      display: none;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
      font-size: 14px;
      border-bottom: 1px solid #f0f1f3;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: #6b7280;
    }

    .profile-value {
      font-weight: 500;
      text-align: right;
    }

    .chat {
      flex: 1;
      padding: 20px 16px 110px;
    }

    .message {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 12px;
      line-height: 1.4;
      font-size: 15px;
    }

    .bot {
      background: white;
      border: 1px solid #e5e7eb;
      margin-right: auto;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid #e5e7eb;
    }

    .input-inner {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .send {
      background: #111827;
      color: white;
    }

    .mic {
      width: 48px;
      background: #e5e7eb;
    }

    .mic.active {
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="title">AI Tutor</div>
      <div class="subtitle">Online Conversation</div>
      <div class="status" id="userStatus">Connecting...</div>
    </div>

    <div class="profile" id="profile">
      <div class="profile-name" id="profileName"></div>

      <div class="profile-row">
        <span class="profile-label">Interface language</span>
        <span class="profile-value" id="interfaceLanguage">—</span>
      </div>

      <div class="profile-row">
        <span class="profile-label">Learning language</span>
        <span class="profile-value" id="learningLanguage">—</span>
      </div>

      <div class="profile-row">
        <span class="profile-label">Level</span>
        <span class="profile-value" id="level">—</span>
      </div>

      <div class="profile-row">
        <span class="profile-label">Goal</span>
        <span class="profile-value" id="goal">—</span>
      </div>
    </div>

    <div class="chat" id="chat">

      <div class="message bot">
        Hello! I'm your AI language tutor.
      </div>

      <div class="message bot">
        We can practice speaking, have a free conversation, or work on your mistakes.
      </div>

    </div>

  </div>

  <div class="input-area">
    <div class="input-inner">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
      />

      <button
        class="mic"
        id="micButton"
        onclick="toggleMic()"
      >
        🎙
      </button>

      <button
        class="send"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    let telegramUser = null;
    let userProfile = null;

    if (tg) {
      tg.ready();
      tg.expand();

      telegramUser = tg.initDataUnsafe?.user || null;

      connectTelegramUser();
    } else {
      document.getElementById("userStatus").textContent =
        "Telegram WebApp unavailable";
    }

    async function connectTelegramUser() {
      const status = document.getElementById("userStatus");

      if (!tg || !tg.initData) {
        status.textContent = "Telegram connection unavailable";
        return;
      }

      try {
        const response = await fetch(
          "https://qnvuadgqpptazfnuadfe.supabase.co/functions/v1/rapid-worker",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              initData: tg.initData
            })
          }
        );

        const data = await response.json();

        console.log("rapid-worker response:", data);

        if (!response.ok || !data.ok) {
          status.textContent = "Telegram verification failed";
          return;
        }

        telegramUser = data.user;
        userProfile = data.profile;

        status.textContent =
          "Connected: " +
          (telegramUser.first_name || "User") +
          " · ID " +
          telegramUser.id;

        showProfile(userProfile);

      } catch (error) {
        console.error(error);
        status.textContent = "Connection error";
      }
    }

    function showProfile(profile) {
      if (!profile) {
        console.log("No profile found");
        return;
      }

      const profileElement = document.getElementById("profile");

      document.getElementById("profileName").textContent =
        profile.first_name || "User";

      document.getElementById("interfaceLanguage").textContent =
        profile.interface_language || "—";

      document.getElementById("learningLanguage").textContent =
        profile.learning_language || "—";

      document.getElementById("level").textContent =
        profile.level || "—";

      document.getElementById("goal").textContent =
        profile.goal || "—";

      profileElement.style.display = "block";
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text) return;

      const chat = document.getElementById("chat");

      const message = document.createElement("div");
      message.className = "message user";
      message.textContent = text;

      chat.appendChild(message);

      input.value = "";

      chat.scrollTop = chat.scrollHeight;
    }

    function toggleMic() {
      const button = document.getElementById("micButton");

      button.classList.toggle("active");
    }

    document
      .getElementById("messageInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
