<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>AI Tutor</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 22px 20px 14px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 4px;
      color: #6b7280;
      font-size: 14px;
    }

    .status {
      margin-top: 8px;
      color: #9ca3af;
      font-size: 12px;
    }

    .profile {
      margin: 16px;
      padding: 16px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      display: none;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 7px 0;
      font-size: 14px;
      border-bottom: 1px solid #f0f1f3;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: #6b7280;
    }

    .profile-value {
      font-weight: 500;
      text-align: right;
    }

    .chat {
      flex: 1;
      padding: 20px 16px 110px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 16px;
      margin-bottom: 12px;
      line-height: 1.45;
      font-size: 15px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .bot {
      background: white;
      border: 1px solid #e5e7eb;
      margin-right: auto;
    }

    .user {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .voice-player {
      width: 100%;
      margin-top: 10px;
      display: block;
    }

    .input-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid #e5e7eb;
      z-index: 100;
    }

    .input-inner {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .send {
      background: #111827;
      color: white;
    }

    .mic {
      width: 48px;
      padding: 0;
      background: #e5e7eb;
    }

    .mic.active {
      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title" id="title">AI Tutor</div>
    <div class="subtitle" id="subtitle">Online Conversation</div>
    <div class="status" id="userStatus">Connecting...</div>
  </div>

  <div class="profile" id="profile">

    <div class="profile-name" id="profileName"></div>

    <div class="profile-row">
      <span class="profile-label" id="learningLabel"></span>
      <span class="profile-value" id="learningLanguage">—</span>
    </div>

    <div class="profile-row">
      <span class="profile-label" id="levelLabel"></span>
      <span class="profile-value" id="level">—</span>
    </div>

    <div class="profile-row">
      <span class="profile-label" id="goalLabel"></span>
      <span class="profile-value" id="goal">—</span>
    </div>

  </div>

  <div class="chat" id="chat"></div>

</div>

<div class="input-area">

  <div class="input-inner">

    <input
      id="messageInput"
      type="text"
    />

    <button
      class="mic"
      id="micButton"
      onclick="toggleMic()"
    >
      🎙
    </button>

    <button
      class="send"
      onclick="sendMessage()"
      id="sendButton"
    >
      Send
    </button>

  </div>

</div>

<script>

const RAPID_URL =
  "https://qnvuadgqpptazfnuadfe.supabase.co/functions/v1/rapid-worker";


const tg =
  window.Telegram?.WebApp;


let telegramUser =
  null;

let userProfile =
  null;

let currentAudio =
  null;


// =====================================================
// CHAT ELEMENT
// =====================================================

const chat =
  document.getElementById("chat");


// =====================================================
// AUTO SCROLL
// =====================================================

function scrollChatToBottom() {

  if (!chat) {
    return;
  }

  const scroll = () => {

    chat.scrollTop =
      chat.scrollHeight;

    chat.scrollTo({
      top: chat.scrollHeight,
      behavior: "auto"
    });

  };


  // Immediately
  scroll();


  // After browser layout
  requestAnimationFrame(() => {

    scroll();

    requestAnimationFrame(() => {

      scroll();

    });

  });


  // After dynamic content
  setTimeout(() => {

    scroll();

  }, 50);


  setTimeout(() => {

    scroll();

  }, 150);


  setTimeout(() => {

    scroll();

  }, 300);

}


// =====================================================
// OBSERVE CHAT CHANGES
// =====================================================

const chatObserver =
  new MutationObserver(() => {

    scrollChatToBottom();

  });


chatObserver.observe(
  chat,
  {
    childList: true,
    subtree: true,
    characterData: true
  }
);


// =====================================================
// UI TRANSLATIONS
// =====================================================

const UI = {

  ru: {
    title: "AI Репетитор",
    subtitle: "Онлайн-разговор",
    learning: "Изучаемый язык",
    level: "Уровень",
    goal: "Цель",
    input: "Напишите сообщение...",
    send: "Отправить",
    welcome: "Привет! Я твой AI-репетитор.",
    welcome2: "Здесь мы можем свободно общаться и практиковать язык.",
    connected: "Подключено"
  },

  en: {
    title: "AI Tutor",
    subtitle: "Online Conversation",
    learning: "Learning language",
    level: "Level",
    goal: "Goal",
    input: "Type a message...",
    send: "Send",
    welcome: "Hi! I'm your AI language tutor.",
    welcome2: "We can have a free conversation and practice your language.",
    connected: "Connected"
  },

  sr: {
    title: "AI Tutor",
    subtitle: "Online razgovor",
    learning: "Jezik koji učiš",
    level: "Nivo",
    goal: "Cilj",
    input: "Napiši poruku...",
    send: "Pošalji",
    welcome: "Zdravo! Ja sam tvoj AI tutor jezika.",
    welcome2: "Možemo slobodno da razgovaramo i vežbamo jezik.",
    connected: "Povezano"
  },

  es: {
    title: "Tutor de IA",
    subtitle: "Conversación online",
    learning: "Idioma que aprendes",
    level: "Nivel",
    goal: "Objetivo",
    input: "Escribe un mensaje...",
    send: "Enviar",
    welcome: "¡Hola! Soy tu tutor de idiomas con IA.",
    welcome2: "Podemos conversar libremente y practicar el idioma.",
    connected: "Conectado"
  },

  de: {
    title: "KI-Tutor",
    subtitle: "Online-Gespräch",
    learning: "Lernsprache",
    level: "Niveau",
    goal: "Ziel",
    input: "Nachricht schreiben...",
    send: "Senden",
    welcome: "Hallo! Ich bin dein KI-Sprachtutor.",
    welcome2: "Wir können frei sprechen und deine Sprache üben.",
    connected: "Verbunden"
  },

  fr: {
    title: "Tuteur IA",
    subtitle: "Conversation en ligne",
    learning: "Langue étudiée",
    level: "Niveau",
    goal: "Objectif",
    input: "Écrivez un message...",
    send: "Envoyer",
    welcome: "Bonjour ! Je suis votre tuteur de langue IA.",
    welcome2: "Nous pouvons discuter librement et pratiquer la langue.",
    connected: "Connecté"
  }

};


function getUI(lang) {

  return UI[lang] || UI.en;

}


// =====================================================
// TELEGRAM INIT
// =====================================================

if (tg) {

  tg.ready();

  tg.expand();

  telegramUser =
    tg.initDataUnsafe?.user || null;

  connectTelegramUser();

} else {

  document.getElementById(
    "userStatus"
  ).textContent =
    "Telegram WebApp unavailable";

}


// =====================================================
// CONNECT USER
// =====================================================

async function connectTelegramUser() {

  const status =
    document.getElementById(
      "userStatus"
    );


  if (!tg || !tg.initData) {

    status.textContent =
      "Telegram connection unavailable";

    return;

  }


  try {

    const response =
      await fetch(
        RAPID_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData:
              tg.initData
          })
        }
      );


    const data =
      await response.json();


    console.log(
      "rapid-worker response:",
      data
    );


    if (
      !response.ok ||
      !data.ok
    ) {

      status.textContent =
        "Telegram verification failed";

      return;

    }


    telegramUser =
      data.user;

    userProfile =
      data.profile;


    setupInterface(
      userProfile
    );


    await loadChatHistory();


  } catch (error) {

    console.error(error);

    status.textContent =
      "Connection error";

  }

}


// =====================================================
// SETUP INTERFACE
// =====================================================

function setupInterface(profile) {

  const lang =
    profile?.interface_language ||
    "en";


  const ui =
    getUI(lang);


  document.documentElement.lang =
    lang;


  document.getElementById(
    "title"
  ).textContent =
    ui.title;


  document.getElementById(
    "subtitle"
  ).textContent =
    ui.subtitle;


  document.getElementById(
    "learningLabel"
  ).textContent =
    ui.learning;


  document.getElementById(
    "levelLabel"
  ).textContent =
    ui.level;


  document.getElementById(
    "goalLabel"
  ).textContent =
    ui.goal;


  document.getElementById(
    "messageInput"
  ).placeholder =
    ui.input;


  document.getElementById(
    "sendButton"
  ).textContent =
    ui.send;


  document.getElementById(
    "userStatus"
  ).textContent =
    ui.connected +
    ": " +
    (
      telegramUser?.first_name ||
      "User"
    );


  showProfile(
    profile,
    lang
  );


  showWelcome(
    ui
  );

}


// =====================================================
// PROFILE
// =====================================================

) {

  }


  document.getElementById(
    "profileName"
  ).textContent =
    profile.first_name ||

    "learningLanguage"
  ).textContent =
    profile.learning_language ||
    "—";

    "level"
  ).textContent =

    "goal"

    "—";

    "profile"

}


// =====================================================
// WELCOME
// =====================================================

function showWelcome(ui) {

  chat.innerHTML =
    "";


  const first =
    document.createElement(
      "div"
    );


  first.className =
    "message bot";


  first.textContent =
    ui.welcome;


  chat.appendChild(
    first
  );


  const second =
    document.createElement(
      "div"
    );


  second.className =
    "message bot";


  second.textContent =
    ui.welcome2;


  chat.appendChild(
    second
  );


  scrollChatToBottom();

}


// =====================================================
// LOAD HISTORY
// =====================================================

async function loadChatHistory() {

  try {

    const response =
      await fetch(
        RAPID_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData:
              tg.initData,

            load_history:
              true
          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok ||
      !data.history
    ) {

      console.error(
        "History load failed:",
        data
      );

      return;

    }


    chat.innerHTML =
      "";


    data.history.forEach(
      (message) => {

        const messageElement =
          document.createElement(
            "div"
          );


        messageElement.className =
          message.role === "user"
            ? "message user"
            : "message bot";


        messageElement.textContent =
          message.content;


        chat.appendChild(
          messageElement
        );

      }
    );


    scrollChatToBottom();


  } catch (error) {

    console.error(
      "History load error:",
      error
    );

  }

}


// =====================================================
// CREATE AI AUDIO PLAYER
// =====================================================

function addAudioPlayer(
  container,
  audioBlob
) {

  if (
    !container ||
    !audioBlob
  ) {

    return;

  }


  const audioUrl =
    URL.createObjectURL(
      audioBlob
    );


  const audio =
    document.createElement(
      "audio"
    );


  audio.className =
    "voice-player";


  audio.controls =
    true;


  audio.preload =
    "metadata";


  audio.src =
    audioUrl;


  container.appendChild(
    audio
  );


  scrollChatToBottom();


  return audio;

}


// =====================================================
// PLAY AI SPEECH + ADD REPLAY PLAYER
// =====================================================

async function playSpeech(
  text,
  messageContainer
) {

  if (!text) {
    return;
  }


  try {

    console.log(
      "REQUESTING TTS"
    );


    const response =
      await fetch(
        RAPID_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData:
              tg.initData,

            tts:
              true,

            text:
              text
          })
        }
      );


    const data =
      await response.json();


    console.log(
      "TTS RESPONSE:",
      data
    );


    if (
      !response.ok ||
      !data.ok ||
      !data.audio
    ) {

      console.error(
        "TTS failed:",
        data
      );

      return;

    }


    const binaryString =
      atob(
        data.audio
      );


    const len =
      binaryString.length;


    const bytes =
      new Uint8Array(
        len
      );


    for (
      let i = 0;
      i < len;
      i++
    ) {

      bytes[i] =
        binaryString.charCodeAt(i);

    }


    const audioBlob =
      new Blob(
        [bytes],
        {
          type:
            "audio/mpeg"
        }
      );


    const audio =
      addAudioPlayer(
        messageContainer,
        audioBlob
      );


    if (currentAudio) {

      try {

        currentAudio.pause();

      } catch {}

      currentAudio =
        null;

    }


    currentAudio =
      audio;


    if (currentAudio) {

      try {

        await currentAudio.play();

      } catch (playError) {

        console.warn(
          "AUTOPLAY BLOCKED:",
          playError
        );

      }

    }


    scrollChatToBottom();


  } catch (error) {

    console.error(
      "TTS PLAY ERROR:",
      error
    );

  }

}


// =====================================================
// SEND TEXT MESSAGE
// =====================================================

async function sendMessage() {

  console.log(
    "SEND MESSAGE START"
  );


  const input =
    document.getElementById(
      "messageInput"
    );


  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  console.log(
    "MESSAGE:",
    text
  );


  const sendButton =
    document.getElementById(
      "sendButton"
    );


  const userMessage =
    document.createElement(
      "div"
    );


  userMessage.className =
    "message user";


  userMessage.textContent =
    text;


  chat.appendChild(
    userMessage
  );


  input.value =
    "";


  scrollChatToBottom();


  const thinking =
    document.createElement(
      "div"
    );


  thinking.className =
    "message bot";


  thinking.textContent =
    "...";


  chat.appendChild(
    thinking
  );


  scrollChatToBottom();


  sendButton.disabled =
    true;


  console.log(
    "BEFORE FETCH"
  );


  try {

    const response =
      await fetch(
        RAPID_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData:
              tg.initData,

            message:
              text
          })
        }
      );


    console.log(
      "FETCH RESPONSE:",
      response.status
    );


    const data =
      await response.json();


    console.log(
      "AI RESPONSE:",
      data
    );


    if (
      !response.ok ||
      !data.ok
    ) {

      thinking.textContent =
        data.error ||
        "AI response failed.";


      scrollChatToBottom();


      return;

    }


    thinking.textContent =
      data.answer ||
      "...";


    scrollChatToBottom();


  } catch (error) {

    console.error(
      "FETCH ERROR:",
      error
    );


    thinking.textContent =
      "Connection error.";


    scrollChatToBottom();


  } finally {

    sendButton.disabled =
      false;

  }

}


// =====================================================
// SEND VOICE TEXT TO AI + TTS
// =====================================================

async function sendVoiceToAI(
  text
) {

  const thinking =
    document.createElement(
      "div"
    );


  thinking.className =
    "message bot";


  thinking.textContent =
    "...";


  chat.appendChild(
    thinking
  );


  scrollChatToBottom();


  try {

    const response =
      await fetch(
        RAPID_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            initData:
              tg.initData,

            message:
              text
          })
        }
      );


    const data =
      await response.json();


    console.log(
      "VOICE AI RESPONSE:",
      data
    );


    if (
      !response.ok ||
      !data.ok
    ) {

      thinking.textContent =
        data.error ||
        "AI response failed.";


      scrollChatToBottom();


      return;

    }


    thinking.textContent =
      data.answer ||
      "...";


    scrollChatToBottom();


    await playSpeech(
      data.answer,
      thinking
    );


  } catch (error) {

    console.error(
      "VOICE AI ERROR:",
      error
    );


    thinking.textContent =
      "Connection error.";


    scrollChatToBottom();

  }

}


// =====================================================
// MICROPHONE
// =====================================================

function toggleMic() {

  const button =
    document.getElementById(
      "micButton"
    );


  if (
    !window.MediaRecorder ||
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    alert(
      "Voice recording is not supported."
    );

    return;

  }


  if (
    window.currentRecorder &&
    window.currentRecorder.state ===
      "recording"
  ) {

    window.currentRecorder.stop();

    return;

  }


  navigator.mediaDevices
    .getUserMedia({
      audio: true
    })
    .then(
      function(stream) {

        const recorder =
          new MediaRecorder(
            stream
          );


        const audioChunks =
          [];


        window.currentRecorder =
          recorder;


        window.currentAudioChunks =
          audioChunks;


        recorder.ondataavailable =
          function(event) {

            if (
              event.data.size > 0
            ) {

              audioChunks.push(
                event.data
              );

            }

          };


        recorder.onstop =
          async function() {

            stream
              .getTracks()
              .forEach(
                function(track) {

                  track.stop();

                }
              );


            button.classList.remove(
              "active"
            );


            button.textContent =
              "🎙";


            const audioBlob =
              new Blob(
                audioChunks,
                {
                  type:
                    recorder.mimeType ||
                    "audio/webm"
                }
              );


            console.log(
              "VOICE RECORDING READY:",
              audioBlob
            );


            console.log(
              "VOICE SIZE:",
              audioBlob.size
            );


            const thinking =
              document.createElement(
                "div"
              );


            thinking.className =
              "message bot";


            thinking.textContent =
              "...";


            chat.appendChild(
              thinking
            );


            scrollChatToBottom();


            try {

              const formData =
                new FormData();


              formData.append(
                "initData",
                tg.initData
              );


              formData.append(
                "audio",
                audioBlob,
                "voice.webm"
              );


              console.log(
                "SENDING AUDIO TO BACKEND"
              );


              const response =
                await fetch(
                  RAPID_URL,
                  {
                    method: "POST",

                    body:
                      formData
                  }
                );


              console.log(
                "AUDIO RESPONSE:",
                response.status
              );


              const data =
                await response.json();


              console.log(
                "TRANSCRIPTION RESPONSE:",
                data
              );


              if (
                !response.ok ||
                !data.ok
              ) {

                thinking.textContent =
                  data.error ||
                  "Speech recognition failed.";


                scrollChatToBottom();


                return;

              }


              const recognizedText =
                data.text ||
                "";


              if (
                !recognizedText
              ) {

                thinking.textContent =
                  "No speech detected.";


                scrollChatToBottom();


                return;

              }


              thinking.remove();


              const userVoiceMessage =
                document.createElement(
                  "div"
                );


              userVoiceMessage.className =
                "message user";


              userVoiceMessage.textContent =
                recognizedText;


              chat.appendChild(
                userVoiceMessage
              );


              scrollChatToBottom();


              await sendVoiceToAI(
                recognizedText
              );


            } catch (error) {

              console.error(
                "VOICE FETCH ERROR:",
                error
              );


              thinking.textContent =
                "Connection error.";


              scrollChatToBottom();

            }

          };


        recorder.start();


        button.classList.add(
          "active"
        );


        button.textContent =
          "⏹";


        console.log(
          "VOICE RECORDING STARTED"
        );

      }
    )
    .catch(
      function(error) {

        console.error(
          "MICROPHONE ERROR:",
          error
        );


        button.classList.remove(
          "active"
        );


        button.textContent =
          "🎙";


        alert(
          "Microphone access is required."
        );

      }
    );

}

// ENTER KEY
// =====================================================

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );

</script>
