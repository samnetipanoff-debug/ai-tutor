<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>AI Tutor</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />

  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <div id="app" class="app">
    <!-- Header -->
    <header class="header" id="header">
      <div class="header-left">
        <button
          class="header-back"
          id="headerBack"
          type="button"
          aria-label="Back"
          hidden
        >
          <span class="icon" data-icon="back"></span>
        </button>
        <div class="header-title" id="headerTitle">AI Tutor</div>
      </div>
      <div class="header-right">
        <div class="header-status" id="headerStatus"></div>
      </div>
    </header>

    <!-- Screens container -->
    <main class="screen" id="screen"></main>

    <!-- Bottom tab bar -->
    <nav class="tabbar" id="tabbar" hidden>
      <button class="tabbar-item" data-tab="chat" type="button">
        <span class="icon" data-icon="chat"></span>
        <span class="tabbar-label" data-i18n="tabs.chat">Chat</span>
      </button>
      <button class="tabbar-item" data-tab="lessons" type="button">
        <span class="icon" data-icon="book"></span>
        <span class="tabbar-label" data-i18n="tabs.lessons">Lessons</span>
      </button>
      <button class="tabbar-item" data-tab="progress" type="button">
        <span class="icon" data-icon="chart"></span>
        <span class="tabbar-label" data-i18n="tabs.progress">Progress</span>
      </button>
      <button class="tabbar-item" data-tab="profile" type="button">
        <span class="icon" data-icon="user"></span>
        <span class="tabbar-label" data-i18n="tabs.profile">Profile</span>
      </button>
    </nav>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- Loading overlay -->
  <div id="loader" class="loader" hidden>
    <div class="loader-spinner"></div>
  </div>
</body>
</html>
